// 根构建脚本
//
// 插件一律通过 buildscript 的 classpath 引入，不使用 plugins {} DSL——
// 这样内网环境下插件与依赖走同一套仓库，不会出现插件单独指向外网的问题。
//
// 【部署到内网时】仓库声明共 3 处需要改动：本文件的 buildscript 与 allprojects，
// 以及 stress-app/build.gradle 的 buildscript。各处均已备好内网私服注释模板。

buildscript {
    repositories {
        mavenCentral()

        // ---- 内网私服模板（部署时取消注释并改成实际地址）----
        // maven {
        //     url 'http://nexus.intranet/repository/maven-public/'
        //     allowInsecureProtocol = true          // 私服为 http（非 https）时必须
        //     credentials {
        //         username = 'your-username'
        //         password = 'your-password'
        //     }
        // }
    }
    dependencies {
        classpath 'com.gradleup.shadow:com.gradleup.shadow.gradle.plugin:9.4.3'
    }
}

allprojects {
    apply plugin: 'java'
    group = 'cn.chinaclear.fault'
    version = '1.0.0'

    repositories {
        mavenCentral()

        // ---- 内网私服模板（与 buildscript 中的一致，部署时同步启用）----
        // maven {
        //     url 'http://nexus.intranet/repository/maven-public/'
        //     allowInsecureProtocol = true
        //     credentials {
        //         username = 'your-username'
        //         password = 'your-password'
        //     }
        // }
    }
}

subprojects {
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}
