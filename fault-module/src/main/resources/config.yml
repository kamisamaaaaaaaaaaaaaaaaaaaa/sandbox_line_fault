# fault-module 配置（sandbox 模块侧连库：读表1/表2、写表3/表4）
jdbc:
  # 故障库连接串（必填），与 agent 指向同一库
  url: jdbc:mysql://192.168.193.1:3306/fault_sandbox?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&connectTimeout=5000&socketTimeout=10000
  username: root
  password: root123

inject:
  # 分批读取方法清单的批大小（避免大项目一次性读入打爆内存）
  batch:
    size: 5000

log:
  # 模块日志目录（相对路径基于目标进程工作目录）
  dir: logs
