# fault-agent 配置（可被 -javaagent:fault-agent.jar=k1=v1,k2=v2 覆盖）
agent.enabled=true

# 故障库连接
jdbc.url=jdbc:mysql://127.0.0.1:3306/fault_sandbox?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
jdbc.username=root
jdbc.password=root123

# BOOT-INF/lib 第三方白名单：需解析的业务 jar 文件名，逗号分隔（支持前缀匹配）；空=不解析任何 lib
lib.whitelist=

# sandbox.sh 路径（挂载命令：bash sandbox.sh -p <pid> -d "fault-module/inject?id=..."）
sandbox.sh.path=/home/lys2/sandbox/bin/sandbox.sh

# premain 全程总预算（解析+落库+挂载），毫秒
premain.timeout.ms=600000

# 非 -jar 方式启动时的 bootJar 兜底路径
bootJar.path=

# 异机 pending 孤儿判定阈值（分钟）
orphan.threshold.minutes=10
