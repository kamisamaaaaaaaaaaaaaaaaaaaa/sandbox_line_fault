// Spring Boot 2.7.18 验证应用：手工组装标准 bootJar
// （Spring Boot 2.x 的 gradle 插件不兼容 Gradle 8，故不使用 spring-boot-gradle-plugin；
//   nested jar 以 STORED 方式写入，Main-Class 为 spring-boot-loader 的 JarLauncher）
dependencies {
    implementation project(':test-lib')
    implementation 'org.springframework.boot:spring-boot-starter-web:2.7.18'
    runtimeOnly 'org.springframework.boot:spring-boot-loader:2.7.18'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 8
}

jar.enabled = false

def startClass = 'cn.chinaclear.fault.testapp.TestApplication'
def mainClass = 'org.springframework.boot.loader.JarLauncher'

task bootJar(type: Jar, dependsOn: [classes, processResources]) {
    archiveFileName = 'test-app.jar'
    destinationDirectory = layout.buildDirectory.dir('libs')
    // nested jar 必须 STORED（spring-boot-loader 要求）
    entryCompression = ZipEntryCompression.STORED
    manifest {
        attributes(
                'Main-Class': mainClass,
                'Start-Class': startClass,
                'Spring-Boot-Version': '2.7.18',
                'Spring-Boot-Classes': 'BOOT-INF/classes/',
                'Spring-Boot-Lib': 'BOOT-INF/lib/'
        )
    }
    // spring-boot-loader 类放 jar 根
    from {
        configurations.runtimeClasspath
                .filter { it.name.startsWith('spring-boot-loader') }
                .collect { zipTree(it) }
    }
    // 本模块类与资源放 BOOT-INF/classes
    into('BOOT-INF/classes') {
        from sourceSets.main.output
    }
    // 其余运行时依赖放 BOOT-INF/lib
    into('BOOT-INF/lib') {
        from configurations.runtimeClasspath
                .filter { !it.name.startsWith('spring-boot-loader') }
    }
}

build.dependsOn bootJar
